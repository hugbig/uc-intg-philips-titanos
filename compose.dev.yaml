# Dev environment: tests, lint, driver, fake Titan server and Remote simulator.
# Usage: docker compose -f compose.dev.yaml run --rm tests
x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: uc-philips-titanos-dev
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  environment:
    HOME: /tmp
  volumes:
    - .:/app

services:
  tests:
    <<: *dev
    command: ["pytest", "-q"]
    profiles: ["tools"]

  lint:
    <<: *dev
    command: ["ruff", "check", "--no-cache", "."]
    profiles: ["tools"]

  driver:
    <<: *dev
    command: ["python", "-m", "intg_philips_titanos"]
    environment:
      UC_DISABLE_MDNS_PUBLISH: "true"
      UC_CONFIG_HOME: /config
      UC_INTEGRATION_HTTP_PORT: "9090"
    volumes:
      - .:/app
      - ./.dev-config:/config
    ports:
      - "9090:9090"
    networks:
      devnet:
        ipv4_address: ${DEV_SUBNET_PREFIX:-172.28.0}.20

  fake-tv:
    <<: *dev
    command: ["python", "-m", "tests.fake_tv", "--port", "1925"]
    ports:
      - "1925:1925"
    networks:
      devnet:
        ipv4_address: ${DEV_SUBNET_PREFIX:-172.28.0}.10

  core-simulator:
    image: unfoldedcircle/core-simulator:0.83.2-bt
    environment:
      UC_MODEL: UCR3
    ports:
      - "8080:8080"
    volumes:
      - simulator-data:/data
    networks:
      devnet:
        ipv4_address: ${DEV_SUBNET_PREFIX:-172.28.0}.30

networks:
  devnet:
    ipam:
      config:
        # Configurable via DEV_SUBNET_PREFIX in .env if this network overlaps an existing one.
        - subnet: ${DEV_SUBNET_PREFIX:-172.28.0}.0/24

volumes:
  simulator-data:
